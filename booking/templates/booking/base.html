{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresh Fade Barbershop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/site.css' %}"></head><body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'home' %}">Fresh Fade</a><div class="navbar-nav ms-auto">{% if user.is_authenticated %}<a class="nav-link" href="{% url 'book' %}">Book now</a><a class="nav-link" href="{% url 'my_appointments' %}">My appointments</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-link btn btn-link">Log out</button></form>{% else %}<a class="nav-link" href="{% url 'login' %}">Log in</a><a class="nav-link" href="{% url 'register' %}">Register</a>{% endif %}</div></div></nav><main class="container py-5">{% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer class="text-center text-muted py-4">Fresh Fade Barbershop · Look sharp, feel sharper.</footer></body></html>
