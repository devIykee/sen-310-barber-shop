{% extends 'booking/base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><h1>Book your appointment</h1><p class="text-muted">Choose a service, barber, date, and available start time.</p><form method="post" class="card card-body shadow-sm">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}<div class="text-danger small">{{ field.errors }}</div></div>{% endfor %}<div class="text-danger small">{{ form.non_field_errors }}</div><button class="btn btn-dark">Confirm booking</button></form></div></div>{% endblock %}
