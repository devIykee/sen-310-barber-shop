services:
  - type: web
    name: fresh-fade-barbershop
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn freshfade.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
